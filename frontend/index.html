<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自転車経路比較</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <h1>自転車経路比較</h1>
        <p class="subtitle">距離・ルール・安全性・OSMデータ充足度</p>
      </div>
      <section class="status-panel" aria-label="システム状態">
        <span>API <strong id="api-status">確認中</strong></span>
        <span>道路データ <strong id="data-status">確認中</strong></span>
      </section>
    </header>
    <main>
      <section class="map-panel" aria-label="道路地図">
        <div class="panel-heading"><h2>地図</h2><span>出発地と目的地を選択</span></div>
        <div id="map" aria-label="OpenStreetMap道路地図"></div>
      </section>
      <section class="route-panel" aria-label="経路の選択">
        <div class="panel-heading">
          <h2>経路</h2>
          <button id="reset-route" type="button">リセット</button>
        </div>
        <p id="route-status" aria-live="polite">出発地を選択</p>
        <div id="profile-legend" class="profile-legend" aria-label="ルート凡例"></div>
        <dl id="route-summary" class="route-summary" hidden>
          <div><dt>選択中</dt><dd id="metric-profile">-</dd></div>
          <div><dt>距離</dt><dd id="metric-distance">-</dd></div>
          <div><dt>道路区間</dt><dd id="metric-edges">-</dd></div>
          <div><dt>幹線道路率</dt><dd id="metric-major-road">-</dd></div>
          <div><dt>自転車レーン率</dt><dd id="metric-cycleway">-</dd></div>
          <div><dt>信号</dt><dd id="metric-signals">-</dd></div>
          <div><dt>速度情報不明率</dt><dd id="metric-maxspeed-unknown">-</dd></div>
          <div><dt>道幅情報不明率</dt><dd id="metric-width-unknown">-</dd></div>
          <div><dt>路面情報不明率</dt><dd id="metric-surface-unknown">-</dd></div>
          <div><dt>仮コスト</dt><dd id="metric-profile-cost">-</dd></div>
        </dl>
      </section>
      <section class="comparison-panel" aria-label="ルート比較">
        <div class="panel-heading"><h2>ルート比較</h2><span>行を選択して地図上で表示</span></div>
        <div id="route-comparison" class="comparison-wrap" hidden>
          <table>
            <thead>
              <tr>
                <th scope="col">経路</th>
                <th scope="col">距離</th>
                <th scope="col">幹線道路率</th>
                <th scope="col">自転車レーン率</th>
                <th scope="col">信号</th>
                <th scope="col">属性不明率</th>
                <th scope="col">仮コスト</th>
              </tr>
            </thead>
            <tbody id="route-comparison-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer>研究用・暫定評価｜交通規制・安全性は未検証</footer>
  </body>
</html>
